<!-- Spacer for navbar height -->
<div id="navbar-spacer" class="h-16"></div>
<script>
  // Adjust the spacer height to match navbar height
  function adjustNavbarSpacer() {
    const navbar = document.getElementById('navbar');
    const spacer = document.getElementById('navbar-spacer');
    spacer.style.height = navbar.offsetHeight + 'px';
  }
  window.addEventListener('resize', adjustNavbarSpacer);
  window.addEventListener('DOMContentLoaded', adjustNavbarSpacer);

  // Sticky/fixed effect
  window.addEventListener('scroll', function() {
    const navbar = document.getElementById('navbar');
    if (window.scrollY > 0) {
     navbar.classList.add('shadow-md', 'bg-white/90', 'backdrop-blur');
    } else {
     navbar.classList.remove('shadow-md', 'bg-white/90', 'backdrop-blur');
    }
  });
</script>
