<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>SSC</title>
	<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
	<script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
	<nav class="bg-white shadow-sm">
	  <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
	    
	    <!-- Logo -->
	    <div class="text-xl font-bold text-primary">SSC
	    </div>

	    <!-- Menu -->
	    <div class="hidden md:flex space-x-8 text-gray-600 font-medium">
	      <a href="#" class="hover:text-primary">Home</a>
	      <a href="#" class="hover:text-primary">About</a>
	      <a href="#" class="hover:text-primary">Articles</a>
	      <a href="#" class="hover:text-primary">Contact</a>
	    </div>

	    <!-- CTA -->
	    <a href="#" class="hidden md:block bg-primary text-white px-4 py-2 rounded-lg hover:opacity-90">
	      Subscribe
	    </a>

	  </div>
	</nav>

{% assign latest = site.posts.first %}
{{ site.posts | size }}
<section class="bg-gray-50">
  <div class="max-w-6xl mx-auto px-6 py-16">
    
    <a href="{{ latest.url }}" class="grid md:grid-cols-2 gap-8 items-center group">
      
      <div class="overflow-hidden rounded-2xl">
        <img src="{{ latest.image }}" 
             class="w-full h-[320px] object-cover group-hover:scale-105 transition duration-300">
      </div>

      <div>
        <p class="text-sm text-gray-500 mb-2">Latest Article</p>
        <h2 class="text-3xl font-bold text-gray-900 group-hover:text-primary transition">
          {{ latest.title }}
        </h2>
        <p class="mt-4 text-gray-600">
          {{ latest.excerpt }}
        </p>
      </div>

    </a>

  </div>
</section>
<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", user => {
      if (!user) {
        window.netlifyIdentity.on("login", () => {
          document.location.href = "/admin/";
        });
      }
    });
  }

</script>	
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: '#1e40af',
        }
      }
    }
  }
</script>
</body>
</html>
