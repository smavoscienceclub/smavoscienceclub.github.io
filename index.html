<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>SSC</title>
	<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
	<script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
	<nav class="bg-white shadow-sm">
	  <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
	    
	    <!-- Logo -->
	    <div class="text-xl font-bold text-primary">SSC
	    </div>

	    <!-- Menu -->
	    <div class="hidden md:flex space-x-8 text-gray-600 font-medium">
	      <a href="#" class="hover:text-primary">Home</a>
	      <a href="#" class="hover:text-primary">About</a>
	      <a href="#" class="hover:text-primary">Articles</a>
	      <a href="#" class="hover:text-primary">Contact</a>
	    </div>

	    <!-- CTA -->
	    <a href="#" class="hidden md:block bg-primary text-white px-4 py-2 rounded-lg hover:opacity-90">
	      Subscribe
	    </a>

	  </div>
	</nav>

{% assign latest = site.posts.first %}
<section class="relative bg-gray-900">
  
  <a href="{{ latest.url }}" class="block group">
    
    <!-- Background image -->
    <div class="relative h-[420px] md:h-[520px] w-full overflow-hidden">
      <img 
        src="{{ latest.image }}"
        class="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition duration-500"
      >

      <!-- Gradient overlay biar teks kebaca -->
      <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/30 to-transparent"></div>

      <!-- Text content -->
      <div class="absolute bottom-0 left-0 p-6 md:p-10 max-w-2xl">
        <p class="text-sm text-gray-200 mb-2">Terbaru</p>
        
        <h2 class="text-3xl md:text-4xl font-bold text-white group-hover:text-gray-200 transition">
          {{ latest.title }}
        </h2>
        
        <p class="mt-3 text-gray-200">
          {{ latest.excerpt }}
        </p>
      </div>

    </div>

  </a>

</section>
<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", user => {
      if (!user) {
        window.netlifyIdentity.on("login", () => {
          document.location.href = "/admin/";
        });
      }
    });
  }

</script>	
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: '#1e40af',
        }
      }
    }
  }
</script>
</body>
</html>
