<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>SSC</title>
	<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
	<script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<nav class="bg-white shadow-sm fixed top-0 left-0 w-full z-50
            bg-white/80 backdrop-blur
            transition-transform duration-300">
  <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
    
    <!-- Logo -->
    <div class="text-xl font-bold text-primary">
      SSC
    </div>

    <!-- RIGHT SIDE WRAPPER -->
    <div class="flex items-center gap-6">
      
      <!-- Menu (desktop) -->
      <div class="hidden md:flex space-x-8 text-gray-600 font-medium">
        <a href="#" class="hover:text-primary">Tentang Kami</a>
        <a href="#" class="hover:text-primary">Artikel</a>
        <a href="#" class="hover:text-primary">Divisi</a>
      </div>

      <!-- CTA (desktop) -->
      <a href="#" class="hidden md:block bg-primary text-white px-4 py-2 rounded-lg hover:opacity-90">
        Hubungi
      </a>

      <!-- Hamburger (mobile) -->
      <button id="menuBtn" class="md:hidden text-2xl">
        ☰
      </button>

    </div>

  </div>
</nav>
<!-- Overlay -->
<div id="overlay"
     class="fixed inset-0 bg-black/40 z-40 hidden md:hidden"></div>

<!-- Side drawer -->
<div id="mobileMenu"
     class="fixed top-0 right-0 h-full w-64 bg-white z-50
            transform translate-x-full transition-transform duration-300
            md:hidden">

  <div class="p-6 space-y-4 font-medium text-gray-700">

    <a href="#" class="block">Tentang Kami</a>
    <a href="#" class="block">Artikel</a>
    <a href="#" class="block">Divisi</a>

    <a href="#" class="block mt-4 bg-primary text-white px-4 py-2 rounded-lg text-center">
      Hubungi
    </a>

  </div>
</div>

<!-- Landing -->
{% assign latest = site.posts.first %}
<section class="relative bg-gray-900">
  
  <a href="{{ latest.url }}" class="block group">
    
    <!-- Background image -->
    <div class="relative h-screen  w-full overflow-hidden">
      <img 
        src="{{ latest.image }}"
        class="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition duration-500"
      >

      <!-- Gradient overlay biar teks kebaca -->
      <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/30 to-transparent"></div>

      <!-- Text content -->
      <div class="absolute bottom-0 left-0 p-6 md:p-10 max-w-2xl">
        <p class="text-sm text-gray-200 mb-2">Terbaru</p>
        
        <h2 class="text-3xl md:text-4xl font-bold text-white group-hover:text-gray-200 transition" style="text-shadow: 0 2px 8px rgba(0,0,0,0.6);">
          {{ latest.title }}
        </h2>
        
		<p class="mt-3 text-white mix-blend-difference relative z-10" style="text-shadow: 0 2px 8px rgba(0,0,0,0.6);">
		  {{ latest.excerpt }}
		</p>
      </div>

    </div>

  </a>

</section>
<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", user => {
      if (!user) {
        window.netlifyIdentity.on("login", () => {
          document.location.href = "/admin/";
        });
      }
    });
  }

</script>	
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: '#1e40af',
        }
      }
    }
  }
</script>
<script>
const btn = document.getElementById('menuBtn');
const menu = document.getElementById('mobileMenu');
const overlay = document.getElementById('overlay');

btn.addEventListener('click', () => {
  menu.classList.remove('translate-x-full');
  overlay.classList.remove('hidden');
});

overlay.addEventListener('click', () => {
  menu.classList.add('translate-x-full');
  overlay.classList.add('hidden');
});
</script>
</body>
</html>
