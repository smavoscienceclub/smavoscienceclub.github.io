---
layout: default
title: Home
---

<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>SSC</title>
	<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
	<script src="https://cdn.tailwindcss.com"></script>
</head>
<body>


<!-- Landing -->
{% assign latest = site.posts.first %}
<section class="relative bg-gray-900">
  
  <a href="{{ latest.url }}" class="block group">
    
    <!-- Background image -->
    <div class="relative h-screen  w-full overflow-hidden">
      <img 
        src="{{ latest.image }}"
        class="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition duration-500"
      >

      <!-- Gradient overlay biar teks kebaca -->
      <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/30 to-transparent"></div>

      <!-- Text content -->
      <div class="absolute bottom-0 left-0 p-6 md:p-10 max-w-2xl">
        <p class="text-sm text-gray-200 mb-2">Terbaru</p>
        
        <h2 class="text-3xl md:text-4xl font-bold text-white group-hover:text-gray-200 transition" style="text-shadow: 0 2px 8px rgba(0,0,0,0.6);">
          {{ latest.title }}
        </h2>
        
		<p class="mt-3 text-white mix-blend-difference relative z-10" style="text-shadow: 0 2px 8px rgba(0,0,0,0.6);">
		  {{ latest.excerpt }}
		</p>
      </div>

    </div>

  </a>
  <!-- No code needed at $PLACEHOLDER$. 
  To use _layouts in Jekyll, move your navbar and shared HTML into a file like _layouts/default.html. 
  Then, in your index.html and other pages, use front matter like: 
  ---
  layout: default
  ---

  And put only the unique content in each page. 
  The layout will automatically wrap your content, so you don't repeat the navbar code. 
  -->
</section>
<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", user => {
      if (!user) {
        window.netlifyIdentity.on("login", () => {
          document.location.href = "/admin/";
        });
      }
    });
  }

</script>	
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: '#1e40af',
        }
      }
    }
  }
</script>
<script>
const btn = document.getElementById('menuBtn');
const menu = document.getElementById('mobileMenu');
const overlay = document.getElementById('overlay');

btn.addEventListener('click', () => {
  menu.classList.remove('translate-x-full');
  overlay.classList.remove('hidden');
});

overlay.addEventListener('click', () => {
  menu.classList.add('translate-x-full');
  overlay.classList.add('hidden');
});
</script>
</body>
</html>
